<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Cadastro de Usuário</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row min-h-screen font-sans">

    <div class="w-full md:w-64 bg-slate-800 text-white p-4">
        <h1 class="text-xl font-bold mb-6 border-b border-slate-600 pb-2">Portal de Atendimento</h1>
        
        <nav>
            <ul class="space-y-2">
                <li><a href="index.html" class="block p-2 hover:bg-slate-700 rounded">Painel Principal</a></li>
                <li><a href="usuarios.html" class="block p-2 bg-blue-600 rounded">Usuários</a></li>
                <li><a href="produtos.html" class="block p-2 hover:bg-slate-700 rounded">Produtos</a></li>
                <li><a href="vendas.html" class="block p-2 hover:bg-slate-700 rounded">Relatórios</a></li>
                <li><a href="geral.html" class="block p-2 hover:bg-slate-700 rounded">Configurações</a></li>
                <li><a href="atendimento.html" class="block p-2 hover:bg-slate-700 rounded">Suporte</a></li>
            </ul>
        </nav>
    </div>

    <div class="flex-1 p-4 md:p-8">
        
        <div class="flex justify-between items-center bg-white p-4 rounded shadow mb-6">
            <h2 class="text-lg font-semibold">Cadastrar Novo Usuário</h2>
            <a href="index.html" class="text-red-500 hover:underline">Sair</a>
        </div>

        <div class="bg-white p-6 rounded shadow max-w-2xl">
            <form action="usuarios.html">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Nome Completo</label>
                    <input type="text" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">E-mail</label>
                    <input type="email" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Perfil de Acesso</label>
                    <select class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
                        <option>Administrador</option>
                        <option>Suporte</option>
                        <option>Atendente</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 mb-2">Senha</label>
                    <input type="password" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
                </div>

                <div class="flex gap-4">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-500">Salvar Usuário</button>
                    <a href="usuarios.html" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400 text-center">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
