<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row min-h-screen font-sans">

    <div class="w-full md:w-64 bg-slate-800 text-white p-4">
        <h1 class="text-xl font-bold mb-6 border-b border-slate-600 pb-2">Portal de Atendimento</h1>
        
        <nav>
            <ul class="space-y-2">
                <li><a href="index.html" class="block p-2 bg-blue-600 rounded">Painel Principal</a></li>
                <li><a href="usuarios.html" class="block p-2 hover:bg-slate-700 rounded">Usuários</a></li>
                <li><a href="produtos.html" class="block p-2 hover:bg-slate-700 rounded">Produtos</a></li>
                <li><a href="vendas.html" class="block p-2 hover:bg-slate-700 rounded">Relatórios</a></li>
                <li><a href="geral.html" class="block p-2 hover:bg-slate-700 rounded">Configurações</a></li>
                <li><a href="atendimento.html" class="block p-2 hover:bg-slate-700 rounded">Suporte</a></li>
            </ul>
        </nav>
    </div>

    <div class="flex-1 p-4 md:p-8">
        
        <div class="flex justify-between items-center bg-white p-4 rounded shadow mb-6">
            <h2 class="text-lg font-semibold">Olá, Administrador</h2>
            <a href="#" class="text-red-500 hover:underline">Sair</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            
            <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm">Total de Usuários</p>
                <p class="text-xl font-bold">1.254</p>
            </div>
            
            <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-sm">Receita Mês</p>
                <p class="text-xl font-bold">R$ 45.300</p>
            </div>
            
            <div class="bg-white p-4 rounded shadow border-l-4 border-purple-500">
                <p class="text-gray-500 text-sm">Novos Pedidos</p>
                <p class="text-xl font-bold">320</p>
            </div>
            
            <div class="bg-white p-4 rounded shadow border-l-4 border-red-500">
                <p class="text-gray-500 text-sm">Itens Pendentes</p>
                <p class="text-xl font-bold">15</p>
            </div>

        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            
            <div class="bg-white p-4 rounded shadow h-48 flex items-center justify-center border border-gray-200">
                <p class="text-gray-400">Gráfico de Vendas Mensais</p>
            </div>
            
            <div class="bg-white p-4 rounded shadow h-48 flex items-center justify-center border border-gray-200">
                <p class="text-gray-400">Gráfico de Distribuição por Categoria</p>
            </div>

        </div>
