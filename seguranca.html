<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Segurança</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col md:flex-row min-h-screen font-sans">

    <div class="w-full md:w-64 bg-slate-800 text-white p-4">
        <h1 class="text-xl font-bold mb-6 border-b border-slate-600 pb-2">Portal de Atendimento</h1>
        
        <nav>
            <ul class="space-y-2">
                <li><a href="index.html" class="block p-2 hover:bg-slate-700 rounded">Painel Principal</a></li>
                <li><a href="usuarios.html" class="block p-2 hover:bg-slate-700 rounded">Usuários</a></li>
                <li><a href="produtos.html" class="block p-2 hover:bg-slate-700 rounded">Produtos</a></li>
                <li><a href="vendas.html" class="block p-2 hover:bg-slate-700 rounded">Relatórios</a></li>
                <li><a href="geral.html" class="block p-2 bg-blue-600 rounded">Configurações</a></li>
                <li><a href="atendimento.html" class="block p-2 hover:bg-slate-700 rounded">Suporte</a></li>
            </ul>
        </nav>
    </div>

    <div class="flex-1 p-4 md:p-8">
        
        <div class="flex justify-between items-center bg-white p-4 rounded shadow mb-6">
            <h2 class="text-lg font-semibold">Configurações do Sistema</h2>
            <a href="index.html" class="text-red-500 hover:underline">Sair</a>
        </div>

        <div class="mb-6 flex gap-4 border-b border-gray-300 pb-2">
            <a href="geral.html" class="font-medium text-gray-500 hover:text-gray-800 pb-2">Geral</a>
            <a href="seguranca.html" class="font-medium text-blue-600 border-b-2 border-blue-600 pb-2">Segurança</a>
        </div>

        <div class="bg-white p-6 rounded shadow max-w-2xl">
            <h3 class="text-lg font-medium mb-4">Alterar Senha</h3>
            
            <form action="seguranca.html">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Senha Atual</label>
                    <input type="password" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Nova Senha</label>
                    <input type="password" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 mb-2">Confirmar Nova Senha</label>
                    <input type="password" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" required>
                </div>

                <div class="mb-6 pt-4 border-t border-gray-200">
                    <h3 class="text-md font-medium mb-2">Autenticação de Dois Fatores (2FA)</h3>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="2fa" class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                        <label for="2fa" class="text-gray-700">Exigir código por e-mail ao logar</label>
                    </div>
                </div>

                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-500">Atualizar Segurança</button>
            </form>
        </div>

    </div>
</body>
</html>
